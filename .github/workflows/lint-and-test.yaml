---
name: golangci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.6.1
          args: --timeout=5m --tests=false
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: unit tests
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test ./...
