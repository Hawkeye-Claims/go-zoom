---
version: 2
project_name: go-zoom

before:
  hooks:
    - go mod download

builds:
  - id: go-zoom
    main: ./cmd/go-zoom
    binary: go-zoom
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: go-zoom
    ids:
      - go-zoom
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  disable: true
